<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>我的储物间 - 做最好的互联网资源导航</title>
<meta name="description" content="精品资源导航：AI工具、影视动漫、实用工具等。">
<link rel="manifest" href="manifest.json">
<link rel="shortcut icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- 顶栏 -->
<header class="topbar">
  <div class="topbar-inner">
    <div class="logo">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor" aria-hidden="true">
        <path d="M3 3h8v8H3V3zm10 0h8v8h-8V3zM3 13h8v8H3v-8zm10 0h8v8h-8v-8z"/>
      </svg>
      <span id="siteName">我的储物间</span>
    </div>
    <div class="topbar-actions">
      <input type="search" id="searchInput" class="search-input" placeholder="搜索资源…（支持名称/描述/标签）" autocomplete="off">
      <button id="themeToggle" class="theme-btn" title="切换深浅色" aria-label="切换主题">🌙</button>
    </div>
  </div>
</header>

<!-- 公告条（公众号引流位） -->
<div id="wechatNotice" class="notice" hidden></div>

<!-- 分类内容 -->
<main id="content" class="content"></main>

<!-- 空结果提示 -->
<div id="emptyTip" class="empty-tip" hidden>
  <p>没有找到匹配的资源</p>
  <p class="empty-sub">换个关键词试试，或看看其他分类</p>
</div>

<!-- 页脚 -->
<footer id="footer" class="footer"></footer>

<!-- 打赏弹层 -->
<div id="rewardModal" class="modal" hidden>
  <div class="modal-box">
    <button class="modal-close" id="rewardClose" aria-label="关闭">×</button>
    <h3>赞赏支持</h3>
    <p class="modal-sub">如果这个导航对你有帮助，欢迎请我喝杯咖啡 ☕</p>
    <img src="img/reward.png" alt="打赏二维码" class="reward-qr">
    <p class="modal-hint">（把 img/reward.png 换成你自己的收款码图片）</p>
  </div>
</div>

<script src="data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
